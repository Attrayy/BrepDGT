[project]
authors = [
    { name = "LF-masker" },
]
name = "brepdgt"
version = "0.1.0"
description = "B-rep diffusion with SCEA and Dynamic Tanh DiT blocks"
requires-python = ">=3.9,<3.10"  # for installing pymesh required in https://github.com/princeton-vl/DPVO_Docker/issues/7
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
